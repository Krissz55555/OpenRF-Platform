[platformio]
default_envs = esp32s3

description = OpenRF Platform v2.0.0-beta.2 - ESP32-S3 N16R8 Dual-Core

[env:esp32s3]
platform = espressif32
board = openrf-esp32-s3-n16r8
framework = arduino

monitor_speed = 115200

board_build.filesystem = littlefs

lib_deps =
    jgromes/RadioLib
    knolleary/PubSubClient
    bblanchon/ArduinoJson

build_flags =
    -D OPENRF_BETA_RELEASE=1
